[project]
name = "pathfinder-py"
version = "0.1.0"
description = "Python module that connect scripts to Pathfinder"
readme = "README.md"
authors = [
    { name = "Oscar Urselli" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.25.1",
    "pyzmq>=27.1.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
